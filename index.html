<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - PC Parts Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">PC PARTS STORE</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>

    <section id="home" class="home-section">
        <h1>Upgrade PC, Maksimalkan <span class="highlight">Performa.</span></h1>
    </section>

    <section id="products" class="products-section">
        <h2>Products</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="ssd.jpg" alt="SSD">
                <p>SSD</p>
            </div>
            <div class="product-card">
                <img src="ram.jpg" alt="RAM">
                <p>RAM</p>
            </div>
            <div class="product-card">
                <img src="processor.jpg" alt="Prosesor">
                <p>Prosesor</p>
            </div>
            <div class="product-card">
                <img src="vga.jpg" alt="Kartu Grafis">
                <p>Kartu Grafis</p>
            </div>
        </div>
    </section>

    <section id="about" class="about-section">
        <h2>About</h2>
        <p>Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
    </section>
</body>
</html>
